[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "collagen-shg"
version = "0.1.0"
description = "Quantification of collagen organization in SHG microscopy — Phase 0 infrastructure (closed-loop simulator/analyzer)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sbancelin" }]
keywords = ["SHG", "collagen", "microscopy", "structure-tensor", "synthetic-data"]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "zarr>=3.0",
    "tifffile>=2024.1.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gui = ["napari[all]>=0.4.19"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff>=0.4"]

[project.scripts]
collagen-shg-gui = "collagen_shg.gui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/collagen_shg"]

[tool.hatch.build.targets.sdist]
include = ["src/collagen_shg", "configs", "tests", "README.md", "CLAUDE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]  # ambiguous names (e.g. l) acceptable in math-heavy code